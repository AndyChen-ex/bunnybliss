<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="https://res.cloudinary.com/dtszpqdqo/image/upload/w_32,h_32,c_fit/Bliss.LOGO_%E5%9C%96%E6%AA%94-02_yal6m2">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>結帳 | Bliss 布妮絲菓子工房</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #fdf8f3; --cream-dark: #f5ece1;
      --gold: #c9956b; --gold-dark: #a97848; --gold-light: #e8c4a0;
      --pink: #f2b8c6; --pink-light: #fde8ef;
      --brown: #3d2b1f; --brown-mid: #7a5c4f; --brown-light: #b08878;
      --white: #ffffff;
      --shadow: 0 4px 20px rgba(61,43,31,0.08);
      --radius: 16px; --radius-sm: 8px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Noto Sans TC', sans-serif; background: var(--cream); color: var(--brown); min-height: 100vh; }

    header { background: rgba(253,248,243,0.96); backdrop-filter: blur(8px); border-bottom: 1px solid var(--cream-dark); position: sticky; top: 0; z-index: 10; }
    .header-inner { max-width: 1100px; margin: 0 auto; padding: 0 24px; height: 68px; display: flex; align-items: center; gap: 16px; }
    .logo { text-decoration: none; flex-shrink: 0; }
    .logo img { height: 44px; }
    .page-title { flex: 1; text-align: center; font-family: 'Noto Serif TC', serif; font-size: 17px; font-weight: 600; }
    .btn-back { background: none; border: none; cursor: pointer; color: var(--brown-mid); font-size: 14px; font-family: inherit; padding: 6px 0; white-space: nowrap; }

    .checkout-wrap { max-width: 1100px; margin: 0 auto; padding: 32px 24px 80px; display: flex; gap: 28px; align-items: flex-start; }
    .form-col { flex: 1; min-width: 0; }
    .summary-col { width: 320px; flex-shrink: 0; position: sticky; top: 84px; }

    .card { background: var(--white); border-radius: var(--radius); padding: 22px 24px; margin-bottom: 16px; box-shadow: var(--shadow); }
    .card-title { font-family: 'Noto Serif TC', serif; font-size: 15px; font-weight: 600; margin-bottom: 18px; display: flex; align-items: center; gap: 10px; }
    .step-num { width: 22px; height: 22px; border-radius: 50%; background: var(--gold); color: var(--white); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

    .fg { margin-bottom: 12px; }
    .fg label { display: block; font-size: 12px; font-weight: 700; color: var(--brown-mid); margin-bottom: 5px; letter-spacing: 0.3px; }
    .fg input, .fg select { width: 100%; padding: 10px 13px; border: 1.5px solid var(--cream-dark); border-radius: var(--radius-sm); font-family: inherit; font-size: 14px; color: var(--brown); background: var(--white); outline: none; transition: border-color 0.2s; }
    .fg input:focus, .fg select:focus { border-color: var(--gold); }
    .fg-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .option-list { display: flex; flex-direction: column; gap: 10px; }
    .opt { display: flex; align-items: center; gap: 14px; padding: 13px 16px; border: 2px solid var(--cream-dark); border-radius: 12px; cursor: pointer; transition: all 0.2s; user-select: none; }
    .opt:has(input:checked) { border-color: var(--gold); background: #fff8f0; }
    .opt input[type=radio] { width: 17px; height: 17px; accent-color: var(--gold); cursor: pointer; flex-shrink: 0; }
    .opt-icon { font-size: 20px; flex-shrink: 0; }
    .opt-body { flex: 1; }
    .opt-name { font-size: 14px; font-weight: 600; color: var(--brown); }
    .opt-sub { font-size: 12px; color: var(--brown-light); margin-top: 2px; }
    .opt-fee { font-size: 14px; font-weight: 700; color: var(--gold); flex-shrink: 0; }

    .extra { margin-top: 10px; padding: 12px 14px; background: var(--cream); border-radius: 10px; display: none; }
    .extra.show { display: block; }

    .summary-items { max-height: 220px; overflow-y: auto; }
    .s-item { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--cream-dark); align-items: center; }
    .s-item:last-child { border-bottom: none; }
    .s-item img { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; background: var(--cream-dark); flex-shrink: 0; }
    .s-item-info { flex: 1; min-width: 0; }
    .s-item-name { font-size: 12px; font-weight: 600; color: var(--brown); line-height: 1.4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .s-item-qty { font-size: 11px; color: var(--brown-light); margin-top: 2px; }
    .s-item-price { font-size: 13px; font-weight: 700; color: var(--gold); flex-shrink: 0; }

    .sum-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--brown-mid); margin: 6px 0; }
    .sum-divider { height: 1px; background: var(--cream-dark); margin: 10px 0; }
    .sum-total { display: flex; justify-content: space-between; font-size: 18px; font-weight: 700; color: var(--brown); }
    .sum-total .amt { color: var(--gold); }

    .autofill-row {
      display: flex; align-items: center; gap: 8px; margin-bottom: 14px;
      font-size: 13px; font-weight: 600; color: var(--brown-mid);
      cursor: pointer; user-select: none;
    }
    .autofill-row input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--gold); cursor: pointer; }
    .btn-submit { width: 100%; background: var(--gold); color: var(--white); border: none; padding: 15px; border-radius: 13px; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; transition: background 0.2s; margin-top: 14px; }
    .btn-submit:hover { background: var(--gold-dark); }

    .field-err { font-size: 12px; color: #e05555; margin-top: 6px; display: none; }
    .field-err.show { display: block; }
    .ferr { font-size: 12px; color: #e05555; margin-top: 5px; }
    .input-err { border-color: #e05555 !important; background: #fff8f8 !important; }

    /* Store picker button */
    .btn-pick-store { display: inline-block; margin-top: 4px; padding: 9px 18px; border: 1.5px solid var(--gold); border-radius: 50px; background: var(--white); color: var(--gold); font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
    .btn-pick-store:hover { background: var(--gold); color: var(--white); }
    .store-selected-card { padding: 12px 14px; background: #fff8f0; border: 1.5px solid var(--gold); border-radius: 10px; margin-bottom: 10px; }
    .store-selected-label { font-size: 11px; font-weight: 700; color: var(--gold); margin-bottom: 4px; letter-spacing: 0.3px; }
    .store-selected-name { font-size: 14px; font-weight: 600; color: var(--brown); }
    .store-selected-addr { font-size: 12px; color: var(--brown-light); margin-top: 2px; }

    /* Store picker modal */
    .sp-overlay { position: fixed; inset: 0; background: rgba(61,43,31,0.55); z-index: 300; display: none; align-items: flex-end; justify-content: center; padding-bottom: 16px; }
    .sp-overlay.show { display: flex; }
    @media (min-width: 540px) { .sp-overlay { align-items: center; } }
    .sp-box { background: var(--white); border-radius: 20px; width: 100%; max-width: 560px; height: 85vh; max-height: 85vh; display: flex; flex-direction: column; overflow: hidden; }
    @media (min-width: 540px) { .sp-box { height: auto; max-height: 82vh; } }
    .sp-head { padding: 18px 20px 12px; border-bottom: 1px solid var(--cream-dark); flex-shrink: 0; }
    .sp-head-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .sp-head-row h3 { font-family: 'Noto Serif TC', serif; font-size: 16px; font-weight: 600; }
    .btn-sp-close { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--brown-light); padding: 4px; line-height: 1; }
    .sp-tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
    .sp-tab { padding: 6px 14px; border: 1.5px solid var(--cream-dark); border-radius: 50px; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; background: var(--white); color: var(--brown); }
    .sp-tab.active { border-color: var(--gold); background: var(--gold); color: var(--white); }
    .sp-filters { display: flex; gap: 8px; }
    .sp-filters select, .sp-filters input { flex: 1; padding: 8px 10px; border: 1.5px solid var(--cream-dark); border-radius: 8px; font-family: inherit; font-size: 13px; color: var(--brown); background: var(--white); outline: none; transition: border-color 0.2s; }
    .sp-filters select:focus, .sp-filters input:focus { border-color: var(--gold); }
    .sp-body { flex: 1; overflow-y: auto; padding: 12px 16px; }
    .sp-status { text-align: center; padding: 48px 20px; color: var(--brown-light); font-size: 14px; }
    .sp-count { font-size: 12px; color: var(--brown-light); padding: 0 2px 8px; }
    .sp-store { padding: 11px 14px; border: 1.5px solid var(--cream-dark); border-radius: 10px; margin-bottom: 8px; cursor: pointer; transition: all 0.2s; }
    .sp-store:hover { border-color: var(--gold); background: #fff8f0; }
    .sp-store-name { font-size: 14px; font-weight: 600; color: var(--brown); margin-bottom: 3px; }
    .sp-store-addr { font-size: 12px; color: var(--brown-light); }

    /* Confirmation */
    .overlay { position: fixed; inset: 0; background: rgba(61,43,31,0.5); z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px; }
    .overlay.show { display: flex; }
    .confirm-box { background: var(--white); border-radius: 24px; padding: 36px 28px; max-width: 460px; width: 100%; text-align: center; max-height: 90vh; overflow-y: auto; }
    .confirm-emoji { font-size: 52px; margin-bottom: 12px; }
    .confirm-h { font-family: 'Noto Serif TC', serif; font-size: 22px; font-weight: 600; margin-bottom: 6px; }
    .confirm-oid { font-size: 12px; color: var(--brown-light); margin-bottom: 22px; }
    .pay-block { background: var(--cream); border-radius: 12px; padding: 16px; text-align: left; margin-bottom: 20px; }
    .pay-block h4 { font-size: 13px; font-weight: 700; color: var(--brown); margin-bottom: 8px; }
    .pay-block p { font-size: 13px; color: var(--brown-mid); line-height: 1.9; white-space: pre-line; }
    .pay-note { font-size: 12px; color: var(--gold); font-weight: 600; margin-top: 8px; }
    .btn-done { display: inline-block; background: var(--gold); color: var(--white); border: none; padding: 13px 32px; border-radius: 50px; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; text-decoration: none; transition: background 0.2s; }
    .btn-done:hover { background: var(--gold-dark); }

    .empty-state { text-align: center; padding: 80px 24px; }
    .empty-state .icon { font-size: 52px; opacity: 0.35; margin-bottom: 16px; }
    .empty-state h2 { font-family: 'Noto Serif TC', serif; font-size: 20px; margin-bottom: 10px; }
    .empty-state p { color: var(--brown-light); margin-bottom: 24px; font-size: 14px; }
    .btn-go { display: inline-block; background: var(--gold); color: var(--white); text-decoration: none; padding: 12px 28px; border-radius: 50px; font-weight: 700; font-size: 14px; }

    @media (max-width: 768px) {
      .checkout-wrap { flex-direction: column; }
      .summary-col { width: 100%; position: static; order: -1; }
      .fg-row { grid-template-columns: 1fr; }
    }

    /* Auth gate */
    #auth-gate { position: fixed; inset: 0; background: var(--cream); z-index: 9999; display: none; align-items: center; justify-content: center; padding: 24px; overflow-y: auto; }
    #auth-gate.show { display: flex; }
    .gate-box { background: var(--white); border-radius: 24px; padding: 32px 28px; width: 100%; max-width: 380px; box-shadow: 0 8px 40px rgba(61,43,31,0.12); }
    .gate-logo { text-align: center; margin-bottom: 6px; font-family: 'Noto Serif TC', serif; font-size: 22px; font-weight: 600; color: var(--gold); }
    .gate-hint { text-align: center; font-size: 13px; color: var(--brown-light); margin-bottom: 22px; }
    .gate-tabs { display: flex; border-bottom: 2px solid var(--cream-dark); margin-bottom: 20px; }
    .gate-tab { flex: 1; background: none; border: none; padding: 10px; font-family: inherit; font-size: 14px; font-weight: 600; color: var(--brown-light); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.2s; }
    .gate-tab.active { color: var(--gold); border-bottom-color: var(--gold); }
    .gate-panel { display: none; }
    .gate-panel.active { display: block; }
    .gate-fg { margin-bottom: 14px; }
    .gate-fg label { display: block; font-size: 12px; font-weight: 700; color: var(--brown-mid); margin-bottom: 5px; }
    .gate-fg input { width: 100%; padding: 10px 13px; border: 1.5px solid var(--cream-dark); border-radius: 8px; font-family: inherit; font-size: 14px; color: var(--brown); background: var(--white); outline: none; transition: border-color 0.2s; }
    .gate-fg input:focus { border-color: var(--gold); }
    .gate-btn { width: 100%; background: var(--gold); color: var(--white); border: none; padding: 13px; border-radius: 12px; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; transition: background 0.2s; margin-top: 4px; }
    .gate-btn:hover { background: var(--gold-dark); }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <a class="logo" href="/"><img src="https://res.cloudinary.com/dtszpqdqo/image/upload/f_auto,q_auto/Bliss.LOGO_%E5%9C%96%E6%AA%94-02_yal6m2" alt="Bliss"></a>
    <div class="page-title">確認訂單</div>
    <button class="btn-back" onclick="history.back()">← 返回</button>
  </div>
</header>

<!-- Auth Gate -->
<div id="auth-gate">
  <div class="gate-box">
    <div class="gate-logo"><img src="https://res.cloudinary.com/dtszpqdqo/image/upload/f_auto,q_auto/Bliss.LOGO_%E5%9C%96%E6%AA%94-02_yal6m2" alt="Bliss" style="height:48px;"></div>
    <div class="gate-hint">請先登入或註冊會員，才能繼續結帳</div>
    <div class="gate-tabs">
      <button class="gate-tab active" id="gate-tab-login" onclick="gateSwitchTab('login')">會員登入</button>
      <button class="gate-tab" id="gate-tab-register" onclick="gateSwitchTab('register')">新會員註冊</button>
    </div>
    <div class="gate-panel active" id="gate-panel-login">
      <div class="gate-fg"><label>電子信箱</label><input id="gate-login-email" type="email" placeholder="請輸入電子信箱"></div>
      <div class="gate-fg"><label>密碼</label><input id="gate-login-pass" type="password" placeholder="請輸入密碼"></div>
      <button class="gate-btn" onclick="gateLogin()">登入</button>
    </div>
    <div class="gate-panel" id="gate-panel-register">
      <div class="gate-fg"><label>姓名</label><input id="gate-reg-name" type="text" placeholder="請輸入真實姓名"></div>
      <div class="gate-fg"><label>手機號碼</label><input id="gate-reg-phone" type="tel" placeholder="0912345678" maxlength="20"></div>
      <div class="gate-fg"><label>電子信箱</label><input id="gate-reg-email" type="email" placeholder="請輸入電子信箱"></div>
      <div class="gate-fg"><label>密碼</label><input id="gate-reg-pass" type="password" placeholder="至少 8 個字元"></div>
      <button class="gate-btn" onclick="gateRegister()">立即註冊</button>
    </div>
  </div>
</div>

<div id="main"></div>

<!-- Store picker modal -->
<div class="sp-overlay" id="sp-overlay" onclick="onSpOverlayClick(event)">
  <div class="sp-box">
    <div class="sp-head">
      <div class="sp-head-row">
        <h3>選擇取貨門市</h3>
        <button class="btn-sp-close" onclick="closeStorePicker()">✕</button>
      </div>
      <div class="sp-tabs" id="sp-tabs"></div>
      <div class="sp-filters">
        <select id="sp-city" onchange="renderStoreList()">
          <option value="">全部縣市</option>
          <option>台北市</option><option>新北市</option><option>桃園市</option>
          <option>台中市</option><option>台南市</option><option>高雄市</option>
          <option>基隆市</option><option>新竹市</option><option>嘉義市</option>
          <option>新竹縣</option><option>苗栗縣</option><option>彰化縣</option>
          <option>南投縣</option><option>雲林縣</option><option>嘉義縣</option>
          <option>屏東縣</option><option>宜蘭縣</option><option>花蓮縣</option>
          <option>台東縣</option><option>澎湖縣</option><option>金門縣</option><option>連江縣</option>
        </select>
        <input id="sp-search" placeholder="搜尋門市名稱…" oninput="renderStoreList()">
      </div>
    </div>
    <div class="sp-body" id="sp-body"><div class="sp-status">請先選擇超商品牌</div></div>
  </div>
</div>

<!-- Confirmation overlay -->
<div class="overlay" id="confirm-overlay">
  <div class="confirm-box">
    <div class="confirm-emoji">🎉</div>
    <div class="confirm-h">訂單已成立！</div>
    <div class="confirm-oid" id="confirm-oid"></div>
    <div class="pay-block" id="pay-block"></div>
    <a class="btn-done" href="/">回到首頁</a>
  </div>
</div>

<script>
// ── Auth gate ────────────────────────────────────────────────────────
function gateSwitchTab(tab) {
  document.getElementById('gate-tab-login').classList.toggle('active', tab === 'login');
  document.getElementById('gate-tab-register').classList.toggle('active', tab === 'register');
  document.getElementById('gate-panel-login').classList.toggle('active', tab === 'login');
  document.getElementById('gate-panel-register').classList.toggle('active', tab === 'register');
}
async function gateLogin() {
  const email = document.getElementById('gate-login-email').value.trim();
  const pass = document.getElementById('gate-login-pass').value;
  if (!email || !pass) { showToast('請填寫電子信箱與密碼'); return; }
  const { error } = await window._sb.auth.signInWithPassword({ email, password: pass });
  if (error) { showToast('登入失敗：電子信箱或密碼錯誤'); return; }
  document.getElementById('auth-gate').classList.remove('show');
  document.body.style.overflow = '';
  showToast('登入成功！歡迎回來');
}
async function gateRegister() {
  const name = document.getElementById('gate-reg-name').value.trim();
  const phone = document.getElementById('gate-reg-phone').value.trim();
  const email = document.getElementById('gate-reg-email').value.trim();
  const pass = document.getElementById('gate-reg-pass').value;
  if (!name || !phone || !email || !pass) { showToast('請填寫所有欄位'); return; }
  if (pass.length < 6) { showToast('密碼至少需要 6 個字元'); return; }
  const { exists } = await fetch('/api/check-email', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email }),
  }).then(r => r.json());
  if (exists) { showToast('此 Email 已註冊，請直接登入'); return; }
  const { data, error } = await window._sb.auth.signUp({ email, password: pass, options: { data: { name, phone } } });
  if (error) { showToast('註冊失敗：' + error.message); return; }
  if (data.session) {
    fetch('/api/profile', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${data.session.access_token}` },
      body: JSON.stringify({ name, phone }),
    }).catch(() => {});
    document.getElementById('auth-gate').classList.remove('show');
    document.body.style.overflow = '';
    showToast('註冊成功！歡迎加入 Bliss');
  } else {
    showToast('驗證信已送出，請查收 Email 完成驗證！');
  }
}
function showToast(msg) {
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastT);
  window._toastT = setTimeout(() => t.classList.remove('show'), 2500);
}
document.getElementById('auth-gate').classList.add('show');
document.body.style.overflow = 'hidden';
// ── End auth gate ─────────────────────────────────────────────────────

function onCityChange() {
  const city = document.getElementById('home-city')?.value;
  const sel  = document.getElementById('home-district');
  if (!sel) return;
  if (!city) { sel.innerHTML = '<option value="">請先選縣市</option>'; return; }
  const areas = TW_DISTRICTS[city] || [];
  sel.innerHTML = '<option value="">請選擇鄉鎮市區</option>' +
    areas.map(a => `<option value="${a.zip}">${a.name}</option>`).join('');
}

// ── 自動填入會員資料 ──────────────────────────────────────────────────────────
async function initAutofill() {
  if (!window._bbUser) return;
  // 顯示自動填入選項
  const row = document.getElementById('autofill-row');
  if (row) row.style.display = 'flex';
}

async function toggleAutofill(checked) {
  if (!checked) {
    document.getElementById('c-name').value = '';
    document.getElementById('c-phone').value = '';
    document.getElementById('c-email').value = '';
    return;
  }
  const user = window._bbUser;
  if (!user) return;

  // 先從 user_metadata 填入（立即）
  document.getElementById('c-name').value  = user.user_metadata?.name  || '';
  document.getElementById('c-email').value = user.email || '';

  // 電話：優先 user_metadata，再 fetch profile
  let phone = user.user_metadata?.phone || '';
  if (!phone && window._sb) {
    try {
      const { data: { session } } = await window._sb.auth.getSession();
      if (session?.access_token) {
        const profile = await fetch('/api/profile', {
          headers: { Authorization: `Bearer ${session.access_token}` },
        }).then(r => r.json());
        phone = profile?.phone || '';
      }
    } catch (e) {}
  }
  document.getElementById('c-phone').value = phone;
}

// auth.js 初始化後呼叫
window._onAuthChange = (user) => {
  const gate = document.getElementById('auth-gate');
  if (user) {
    gate.classList.remove('show');
    document.body.style.overflow = '';
    initAutofill();
  } else {
    gate.classList.add('show');
    document.body.style.overflow = 'hidden';
  }
};

// ── CVS Store Picker ──────────────────────────────────────────────
const CVS_LIST = [
  { key: 'FAMI',    name: '全家',      label: '全家 FamilyMart' },
  { key: 'UNIMART', name: '7-ELEVEN',  label: '7-ELEVEN' },
  { key: 'HILIFE',  name: '萊爾富',   label: '萊爾富 Hi-Life' },
  { key: 'OKMART',  name: 'OK',        label: 'OK mart' },
];

let selectedStore = null;  // { cvsType, storeId, storeName, storeAddr }
let pickerCvsType = 'FAMI';
let pickerStores = [];     // StoreInfo[] for current tab
let storeCache = {};       // cvsType → StoreInfo[]
let pickerLoading = false;

function openStorePicker() {
  document.getElementById('sp-overlay').classList.add('show');
  renderPickerTabs();
  loadStores(pickerCvsType);
}

function closeStorePicker() {
  document.getElementById('sp-overlay').classList.remove('show');
}

function onSpOverlayClick(e) {
  if (e.target === document.getElementById('sp-overlay')) closeStorePicker();
}

function renderPickerTabs() {
  document.getElementById('sp-tabs').innerHTML = CVS_LIST.map(c =>
    `<button class="sp-tab${c.key === pickerCvsType ? ' active' : ''}" onclick="selectPickerTab('${c.key}')">${c.name}</button>`
  ).join('');
}

async function selectPickerTab(cvsType) {
  pickerCvsType = cvsType;
  renderPickerTabs();
  document.getElementById('sp-search').value = '';
  await loadStores(cvsType);
}

async function loadStores(cvsType) {
  if (storeCache[cvsType]) {
    pickerStores = storeCache[cvsType];
    renderStoreList();
    return;
  }
  pickerLoading = true;
  document.getElementById('sp-body').innerHTML = '<div class="sp-status">載入中…</div>';
  try {
    const res = await fetch(`/api/cvs-stores?type=${cvsType}`);
    const data = await res.json();
    if (data.RtnCode !== 1) throw new Error(data.RtnMsg || '綠界回應錯誤');
    const entry = (data.StoreList || []).find(s => s.CvsType === cvsType);
    storeCache[cvsType] = entry ? entry.StoreInfo : [];
    pickerStores = storeCache[cvsType];
  } catch (e) {
    document.getElementById('sp-body').innerHTML = `<div class="sp-status">⚠️ 無法取得門市資料<br><small>${e.message}</small></div>`;
    pickerLoading = false;
    return;
  }
  pickerLoading = false;
  renderStoreList();
}

function normalizeCity(str) {
  return str.replace(/臺/g, '台');
}

function renderStoreList() {
  const city = document.getElementById('sp-city').value;
  const kw = document.getElementById('sp-search').value.trim();

  let list = pickerStores;
  if (city) list = list.filter(s => normalizeCity(s.StoreAddr).includes(normalizeCity(city)));
  if (kw) list = list.filter(s => s.StoreName.includes(kw) || s.StoreAddr.includes(kw));

  const MAX = 80;
  const shown = list.slice(0, MAX);
  const total = list.length;

  if (!shown.length) {
    document.getElementById('sp-body').innerHTML = '<div class="sp-status">沒有符合的門市</div>';
    return;
  }

  const cvsLabel = CVS_LIST.find(c => c.key === pickerCvsType)?.label || '';
  document.getElementById('sp-body').innerHTML =
    `<div class="sp-count">共 ${total} 間${total > MAX ? `，顯示前 ${MAX} 筆，請縮小篩選範圍` : ''}</div>` +
    shown.map(s => `
      <div class="sp-store" onclick="selectStore('${esc(s.StoreId)}','${esc(s.StoreName)}','${esc(s.StoreAddr)}','${cvsLabel}')">
        <div class="sp-store-name">${esc(s.StoreName)}</div>
        <div class="sp-store-addr">${esc(s.StoreAddr)}</div>
      </div>`).join('');
}

function selectStore(storeId, storeName, storeAddr, cvsLabel) {
  selectedStore = { cvsType: pickerCvsType, storeId, storeName, storeAddr, cvsLabel };
  const card = document.getElementById('store-selected-card');
  document.getElementById('store-selected-label').textContent = cvsLabel;
  document.getElementById('store-selected-name').textContent = storeName;
  document.getElementById('store-selected-addr').textContent = storeAddr;
  card.style.display = 'block';
  document.querySelector('.btn-pick-store').textContent = '重新選擇門市';
  closeStorePicker();
}

function getSettings() { return JSON.parse(localStorage.getItem('bb_settings') || '{}'); }
function getOrders() { return JSON.parse(localStorage.getItem('bb_orders') || '[]'); }
function saveOrders(o) { localStorage.setItem('bb_orders', JSON.stringify(o)); }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function subtotal() { return cart.reduce((s, i) => s + i.price * i.qty, 0); }
function total() { return subtotal() + SHIPPING_FEE; }

function clearErrors() {
  document.querySelectorAll('.ferr').forEach(e => e.remove());
  document.querySelectorAll('.input-err').forEach(e => e.classList.remove('input-err'));
}

function markErr(el, msg) {
  clearErrors();
  el.classList.add('input-err');
  const d = document.createElement('div');
  d.className = 'ferr'; d.textContent = msg;
  el.insertAdjacentElement('afterend', d);
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  if (el.tagName === 'INPUT' || el.tagName === 'SELECT') el.focus();
}

function markAfter(el, msg) {
  clearErrors();
  const d = document.createElement('div');
  d.className = 'ferr'; d.textContent = msg;
  el.insertAdjacentElement('afterend', d);
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function onShippingChange() {
  const val = document.querySelector('input[name=shipping]:checked')?.value;
  document.getElementById('extra-cvs').classList.toggle('show', val === 'cvs');
  document.getElementById('extra-home').classList.toggle('show', val === 'home');
}

function generateOrderId() {
  const d = new Date();
  const date = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  return `BB-${date}-${String(Math.floor(Math.random()*9000)+1000)}`;
}

async function submitOrder() {
  const name = document.getElementById('c-name').value.trim();
  const phone = document.getElementById('c-phone').value.trim();
  const email = document.getElementById('c-email').value.trim();
  const shipping = document.querySelector('input[name=shipping]:checked')?.value;
  const payment = document.querySelector('input[name=payment]:checked')?.value;
  if (!name) return markErr(document.getElementById('c-name'), '請填寫姓名');
  if (!phone) return markErr(document.getElementById('c-phone'), '請填寫電話');
  if (phone.replace(/\D/g, '').length < 10) return markErr(document.getElementById('c-phone'), '電話號碼至少需要 10 碼');
  if (!email) return markErr(document.getElementById('c-email'), '請填寫電子郵件');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return markErr(document.getElementById('c-email'), '電子郵件格式不正確');
  if (!shipping) return markAfter(document.querySelector('input[name=shipping]').closest('.option-list'), '請選擇配送方式');
  if (shipping === 'cvs' && !selectedStore) return markAfter(document.querySelector('.btn-pick-store'), '請選擇超商取貨門市');
  if (shipping === 'home') {
    const city = document.getElementById('home-city');
    const dist = document.getElementById('home-district');
    const addr = document.getElementById('home-addr');
    if (!city.value) return markErr(city, '請選擇縣市');
    if (!dist.value) return markAfter(dist, '請選擇鄉鎮市區');
    if (!addr.value.trim()) return markErr(addr, '請填寫詳細地址');
  }
  if (!payment) return markAfter(document.querySelector('input[name=payment]').closest('.option-list'), '請選擇付款方式');
  clearErrors();

  let address = '';
  if (shipping === 'cvs') {
    address = `${selectedStore.cvsLabel}：${selectedStore.storeName}（${selectedStore.storeAddr}）`;
  } else {
    const distEl = document.getElementById('home-district');
    const distName = distEl.options[distEl.selectedIndex]?.text || '';
    address = document.getElementById('home-city').value + distName + document.getElementById('home-addr').value.trim();
  }

  const orderId = generateOrderId();
  const order = {
    id: orderId,
    createdAt: new Date().toISOString(),
    status: '待付款',
    customer: { name, phone, email },
    shipping: {
      method: shipping,
      address,
      fee: SHIPPING_FEE,
      ...(shipping === 'cvs' && { cvsType: selectedStore.cvsType, storeId: selectedStore.storeId }),
    },
    payment: { method: payment },
    items: JSON.parse(JSON.stringify(cart)),
    subtotal: subtotal(),
    total: total()
  };

  localStorage.removeItem('bb_cart');

  // 寫入 DB
  let sessionToken = null;
  try {
    const { data: { session } } = await window._sb.auth.getSession();
    sessionToken = session?.access_token || null;
    if (sessionToken) {
      await fetch('/api/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${sessionToken}` },
        body: JSON.stringify(order),
      });
    }
  } catch (e) {
    console.warn('[orders] DB 寫入失敗，降回 localStorage', e);
    const orders = getOrders();
    orders.unshift(order);
    saveOrders(orders);
  }

  // 信用卡：產生 ECPay 表單並導向綠界付款頁
  if (payment === 'credit' && sessionToken) {
    try {
      const itemName = order.items.map(i => i.name).join('#').slice(0, 200);
      const formHtml = await fetch('/api/ecpay/credit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${sessionToken}` },
        body: JSON.stringify({ orderId: order.id, totalAmount: order.total, itemName }),
      }).then(r => r.text());
      document.open();
      document.write(formHtml);
      document.close();
      return; // 不執行後續 showConfirm
    } catch (e) {
      console.error('[ECPay] 建立付款表單失敗', e);
      showToast('信用卡付款初始化失敗，請改選其他付款方式');
      return;
    }
  }

  showConfirm(order);
}

function showConfirm(order) {
  const settings = getSettings();
  document.getElementById('confirm-oid').textContent = `訂單編號：${order.id}`;

  let html = '';
  if (order.payment.method === 'credit') {
    html = `<h4>💳 信用卡付款</h4><p>正在導向綠界付款頁，請稍候⋯</p>`;
  } else if (order.payment.method === 'linepay') {
    const info = settings.linePayInfo || '請稍候，我們會透過 LINE 傳送付款連結給您。';
    html = `<h4>💚 LINE Pay 付款資訊</h4><p>${esc(info)}</p>`;
  } else {
    const info = settings.transferInfo || '請聯繫我們取得匯款帳號資訊。';
    html = `<h4>🏦 銀行匯款資訊</h4><p>${esc(info)}</p><p class="pay-note">請於 3 天內完成匯款，並回傳末 5 碼</p>`;
  }
  html += `<p style="margin-top:10px;font-size:12px;color:var(--brown-light)">如有任何問題請透過 LINE 聯繫我們</p>`;
  document.getElementById('pay-block').innerHTML = html;
  document.getElementById('confirm-overlay').classList.add('show');
}

render();
